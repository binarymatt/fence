syntax = "proto3";

package fence.v1;

import "buf/validate/validate.proto";
import "fence/v1/fence.proto";

option go_package = "github.com/binarymatt/fence/gen/fence/v1;fencev1";

service FenceAdminService {
  rpc CreatePolicies(CreatePoliciesRequest) returns (CreatePoliciesResponse) {}
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse) {}
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse) {}
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse) {}

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}

  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {}
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {}
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {}

  rpc ListTenants(ListTenantRequest) returns (ListTenantResponse) {}
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {}
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {}

  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {}
}

message CreatePoliciesRequest {
  UID tenant = 1;
  repeated Policy policies = 2 [(buf.validate.field).required = true];
}
message CreatePoliciesResponse {
  repeated string ids = 1;
}
message DeletePolicyRequest {
  string id = 1 [(buf.validate.field).required = true];
}
message DeletePolicyResponse {}

// TODO: pagination
message ListPoliciesRequest {
  UID tenant = 1;
}
message ListPoliciesResponse {
  repeated Policy policies = 1;
}
message GetPolicyRequest {
  UID tenant = 1;
  string id = 2 [(buf.validate.field).required = true];
}
message GetPolicyResponse {
  Policy policy = 1;
}
// Tenant definitions
message Tenant {
  UID id = 1 [(buf.validate.field).cel = {
    message: "must be tenant entity"
    expression: "this.type == 'Tenant'"
  }];
  string name = 2;
}
message ListTenantRequest {}
message ListTenantResponse {
  repeated Tenant tenants = 1;
}
message CreateTenantRequest {
  Tenant tenant = 1;
}
message CreateTenantResponse {}

message GetTenantRequest {
  UID id = 1 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "tenant.type"
    message: "must be tenant entity"
    expression: "this.id.type == 'Tenant'"
  };
}
message GetTenantResponse {
  Tenant tenant = 1;
}

message CreateUserRequest {
  UID tenant = 1 [(buf.validate.field).required = true];
  Entity user = 2 [(buf.validate.field).required = true];
  option (buf.validate.message).cel = {
    id: "user.type"
    message: "must be user entity"
    expression: "this.user.uid.type == 'User'"
  };
}
message CreateUserResponse {}

message DeleteUserRequest {
  UID tenant = 1 [(buf.validate.field).required = true];
  UID uid = 2 [(buf.validate.field).required = true];
}
message DeleteUserResponse {}
message ListUsersRequest {
  UID tenant = 1 [(buf.validate.field).required = true];
}
message ListUsersResponse {
  repeated Entity users = 1;
}
message CreateRoleRequest {
  UID tenant = 1 [(buf.validate.field).required = true];
  Entity role = 2;
  option (buf.validate.message).cel = {
    id: "role.type"
    message: "must be role entity"
    expression: "this.role.uid.type == 'Role'"
  };
}
message CreateRoleResponse {}
message DeleteRoleRequest {
  UID uid = 1 [(buf.validate.field).required = true];
}
message DeleteRoleResponse {}
message ListRolesRequest {
  UID tenant = 1 [(buf.validate.field).required = true];
}
message ListRolesResponse {
  repeated Entity roles = 1;
}

message CreateResourceRequest {
  UID tenant = 1 [(buf.validate.field).required = true];
  repeated Entity resources = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 100
  ];
}
message CreateResourceResponse {}
